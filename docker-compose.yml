services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    ports:
      - "8100:8100"
    volumes:
      - ./data/models:/models
    environment:
      - MODEL_NAME=Alibaba-NLP/gte-Qwen2-7B-instruct
      - DEVICE=cuda:0
      - QUANTIZE=int8
      - HOST=0.0.0.0
      - PORT=8100
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']  # 5070ti
              capabilities: [gpu]
    depends_on:
      - qdrant
    restart: unless-stopped
